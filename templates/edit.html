<!doctype html>
<html>
    <head>
        <title>Edit a Routine</title>
        <link rel="stylesheet" href="/static/index.css">
    </head>
    <body>
        <main>
            <header>
                <h1>Edit Your Routine</h1>
                <p>Edit your title. Add to and rearrange steps of your routine.
                    <br>Right-click a step to delete it.
                </p>
            </header>
            <div class="main-div">
                <div class="create-routine-div">
                    <div class="title-input-div">
                        <label for="title-input">Title:</label>
                        <input placeholder="Insert title here" id="title-input" type="text"/>
                    </div>
                    <ul id="draggable-steps-list" oncontextmenu="return false;">
                    </ul>
                    <div class="add-item-div">
                        <input placeholder="Input step here and press '+' to add" id="add-step-input" type="text"/>
                        <button id="add-step-btn" onclick="addStep()">+</button>
                    </div>
                </div>
            </div>
            <div class=homepage-btn-div>
                <button id="cancel-btn" class="routine-page-btn" onclick="cancelRoutine()">Cancel</button>
                <button id="delete-btn" class="routine-page-btn" onclick="deleteRoutine()">Delete Routine</button>
                <button id="save-btn" class="routine-page-btn" onclick="saveRoutine()">Save</button>
            </div>
        </main>
        <script src="/static/edit.js"></script>
    </body>
</html>
